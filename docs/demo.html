<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>记忆星图 · 离线快照</title>
<meta name="theme-color" content="#04060c" />
<meta name="description" content="把散落在各个工作区的记忆抽出来，算成一张带证据的关联星云：看得见、走得通、能带走。" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23070b14'/%3E%3Cg fill='%236ce0ff'%3E%3Ccircle cx='16' cy='15' r='3.2'/%3E%3Ccircle cx='9' cy='11' r='1.6' opacity='.8'/%3E%3Ccircle cx='23' cy='10' r='1.4' opacity='.7'/%3E%3Ccircle cx='21' cy='21' r='1.8' opacity='.75'/%3E%3Ccircle cx='11' cy='22' r='1.3' opacity='.6'/%3E%3C/g%3E%3Cg stroke='%236ce0ff' stroke-opacity='.45' stroke-width='.9'%3E%3Cpath d='M9 11 16 15M23 10 16 15M21 21 16 15M11 22 16 15'/%3E%3C/g%3E%3C/svg%3E" />
<style>
/* 记忆星图 —— 星云界面样式
   设计：深空背景 + 玻璃面板 + 少量高饱和强调色，其余全部压低，
   让「光点」和「连线」成为画面里唯一亮的东西。 */

:root {
  --bg: #04060c;
  --bg-2: #070b14;
  --panel: rgba(12, 17, 28, 0.78);
  --panel-solid: #0b1019;
  --line: rgba(140, 170, 210, 0.14);
  --line-strong: rgba(150, 190, 235, 0.28);
  --text: #dbe6f5;
  --text-dim: #8194ad;
  --text-faint: #6b7f96;   /* 10px 小字也要过 WCAG AA（对面板底 4.63:1），原来的 #526278 只有 3.06 */
  --accent: #6ce0ff;
  --accent-2: #b48cff;
  --warm: #ffcf7a;
  --danger: #ff7a8a;
  --ok: #78e6b0;
  --radius: 14px;
  --shadow: 0 18px 48px rgba(0, 0, 0, 0.55);
  --mono: 'JetBrains Mono', 'Cascadia Code', ui-monospace, 'SF Mono', Consolas, monospace;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  height: 100%;
  background: var(--bg);
  color: var(--text);
  font-family: 'Inter', 'PingFang SC', 'Microsoft YaHei', system-ui, -apple-system, sans-serif;
  font-size: 13px;
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
}

#stage { position: fixed; inset: 0; }

#sky { position: absolute; inset: 0; width: 100%; height: 100%; display: block; cursor: grab; }
#sky.dragging { cursor: grabbing; }
#sky.pointing { cursor: pointer; }
#sky3d, #sky3dlbl { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
#sky3d { cursor: grab; }
#sky3dlbl { pointer-events: none; }
#sky3d[hidden], #sky3dlbl[hidden] { display: none; }

/* 背景：径向柔光 + 极淡噪点，避免大片死黑 */
#vignette {
  position: absolute; inset: 0; pointer-events: none;
  background:
    radial-gradient(1200px 700px at 28% 18%, rgba(72, 120, 190, 0.12), transparent 65%),
    radial-gradient(900px 620px at 78% 76%, rgba(150, 100, 220, 0.10), transparent 68%),
    radial-gradient(700px 500px at 60% 40%, rgba(40, 90, 130, 0.07), transparent 70%);
  mix-blend-mode: screen;
}

.hud { position: absolute; pointer-events: none; }
.hud > * { pointer-events: auto; }

/* ============ 顶栏 ============ */
#topbar {
  top: 0; left: 0; right: 0;
  display: flex; align-items: center; gap: 14px;
  padding: 14px 18px;
  background: linear-gradient(180deg, rgba(4, 6, 12, 0.92), rgba(4, 6, 12, 0));
}

.brand { display: flex; align-items: baseline; gap: 10px; user-select: none; white-space: nowrap; }
.brand b {
  font-size: 15px; letter-spacing: 0.16em; font-weight: 600;
  background: linear-gradient(92deg, #eaf6ff, #9fd4ff 45%, #b48cff);
  -webkit-background-clip: text; background-clip: text; color: transparent;
}
.brand small {
  font-family: var(--mono); font-size: 10px; letter-spacing: 0.22em;
  color: var(--text-faint); text-transform: uppercase;
}

.stat-row { display: flex; gap: 16px; margin-left: 6px; }
.stat { display: flex; flex-direction: column; line-height: 1.15; }
.stat b { font-family: var(--mono); font-size: 14px; font-weight: 600; color: #eaf3ff; }
.stat span { font-size: 10px; color: var(--text-faint); letter-spacing: 0.08em; white-space: nowrap; }

.spacer { flex: 1; }

.btn {
  display: inline-flex; align-items: center; gap: 6px;
  height: 30px; padding: 0 12px;
  border-radius: 9px;
  border: 1px solid var(--line);
  /* 稍微压实一点：底下的节点标签不许透过按钮显形（否则顶栏读起来很脏） */
  background: rgba(16, 22, 34, 0.88);
  backdrop-filter: blur(8px);
  color: var(--text-dim);
  font-size: 12px; cursor: pointer;
  transition: 0.16s ease;
  white-space: nowrap;
}
.btn:hover { color: #eaf6ff; border-color: var(--line-strong); background: rgba(30, 42, 62, 0.85); }
.btn.on { color: #041018; background: linear-gradient(180deg, #9fe9ff, #62cdf0); border-color: transparent; font-weight: 600; }
.btn.ghost { background: rgba(16, 22, 34, 0.55); backdrop-filter: blur(8px); }
/* ghost 按钮被点亮时不能套用 .btn.on 的深色字（它的底色是玻璃，不是亮青） */
.btn.ghost.on { color: #9fe9ff; background: rgba(108, 200, 255, 0.16); border-color: rgba(108, 200, 255, 0.38); }

/* ============ 搜索 ============ */
#searchwrap {
  position: absolute; top: 58px; left: 18px;
  width: 320px;
  display: flex; flex-direction: column; gap: 8px;
  z-index: 30;
}
.searchbox {
  display: flex; align-items: center; gap: 8px;
  height: 38px; padding: 0 12px;
  border-radius: 11px;
  background: rgba(8, 12, 20, 0.86);
  border: 1px solid var(--line);
  box-shadow: var(--shadow);
  backdrop-filter: blur(14px);
}
.searchbox:focus-within { border-color: rgba(108, 224, 255, 0.45); box-shadow: 0 0 0 3px rgba(108, 224, 255, 0.08), var(--shadow); }
.searchbox svg { flex: none; opacity: 0.55; }
#q {
  flex: 1; min-width: 0; height: 100%;
  background: none; border: none; outline: none;
  color: var(--text); font-size: 13px; font-family: inherit;
}
#q::placeholder { color: var(--text-faint); }
.kbd {
  font-family: var(--mono); font-size: 10px; color: var(--text-faint);
  border: 1px solid var(--line); border-radius: 5px; padding: 1px 5px;
}

#hits {
  max-height: min(46vh, 420px); overflow: auto;
  border-radius: 11px;
  background: rgba(8, 12, 20, 0.94);
  border: 1px solid var(--line);
  box-shadow: var(--shadow);
  backdrop-filter: blur(14px);
  display: none;
}
#hits.show { display: block; }
/* 命中列表的抬头：搜了什么、扫了多少、给了几条 */
.hit-head {
  display: flex; align-items: baseline; gap: 10px;
  padding: 8px 12px 7px; border-bottom: 1px solid rgba(120, 150, 190, 0.1);
  position: sticky; top: 0; z-index: 1;
  background: rgba(8, 12, 20, 0.97);
  backdrop-filter: blur(8px);
}
.hit-head .hh-q { font-size: 11.5px; color: #cfe4f5; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hit-head .hh-m { margin-left: auto; flex: none; font-size: 10px; color: var(--text-faint); font-family: var(--mono); }
.hit-unknown { padding: 0 12px 7px; font-size: 10.5px; color: #c9a978; }
.hit-empty { padding: 12px 12px 14px; }
.hit-empty .t { font-size: 12.5px; color: #dceaf8; }
.hit-empty .m { font-size: 10.5px; color: var(--text-faint); margin-top: 4px; line-height: 1.5; }
.hit .hm { color: #9fe9ff; background: rgba(108, 200, 255, 0.12); border-radius: 3px; padding: 0 1px; font-weight: 600; }

.hit {
  padding: 9px 12px; cursor: pointer; border-bottom: 1px solid rgba(120, 150, 190, 0.07);
  display: flex; gap: 9px; align-items: flex-start;
}
.hit:last-child { border-bottom: none; }
.hit:hover, .hit.active { background: rgba(70, 130, 190, 0.14); }
.hit .dot { width: 6px; height: 6px; border-radius: 50%; margin-top: 6px; flex: none; }
.hit .body { min-width: 0; }
.hit .t { font-size: 12.5px; color: #dceaf8; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hit .m { font-size: 10.5px; color: var(--text-faint); margin-top: 3px; font-family: var(--mono); }
.hit .why { font-size: 10.5px; color: #7fb9d8; margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* ============ 左列（来源 + 筛选） ============ */
#leftcol {
  position: absolute; left: 18px; top: 108px; bottom: 18px;
  width: 266px; display: flex; flex-direction: column; gap: 10px;
  overflow: hidden; pointer-events: none;
}
#leftcol > * { pointer-events: auto; }
#leftcol > .hud { position: static; }
#filters {
  position: static;
  width: 100%; flex: 1 1 auto; min-height: 0;
  overflow: auto; padding: 14px;
  border-radius: var(--radius);
  background: var(--panel);
  border: 1px solid var(--line);
  box-shadow: var(--shadow);
  backdrop-filter: blur(16px);
}

/* 记忆来源（谁在写记忆） */
#sources {
  flex: none; padding: 11px 13px;
  border-radius: var(--radius);
  background: var(--panel);
  border: 1px solid var(--line);
  box-shadow: var(--shadow);
  backdrop-filter: blur(16px);
  max-height: 34%;
  overflow: auto;
}
#sources .f-title {
  font-size: 10px; letter-spacing: 0.16em; text-transform: uppercase;
  color: var(--text-faint); margin-bottom: 8px;
  display: flex; justify-content: space-between; align-items: center;
}
#sources .src {
  display: flex; align-items: baseline; gap: 6px;
  font-size: 11px; color: var(--text-dim); padding: 2px 0;
}
#sources .src b { color: var(--text); font-weight: 500; }
#sources .src .n { margin-left: auto; font-family: var(--mono); font-size: 9.5px; color: var(--text-faint); }
#sources .src.on { color: #d6f6ff; }
#sources .dim { font-size: 10.5px; color: var(--text-faint); line-height: 1.5; margin-top: 6px; }
/* 屏蔽表：点一行展开，逐条「恢复」 */
#sources .src-click { cursor: pointer; }
#sources .src-click:hover { color: var(--accent); }
#sources .mutes { margin: 4px 0 6px; display: flex; flex-direction: column; gap: 3px; }
#sources .mute {
  display: flex; align-items: center; gap: 6px;
  font-size: 10px; color: var(--text-faint); line-height: 1.35;
  padding: 3px 5px; border-radius: 6px; background: rgba(255,255,255,0.03);
}
#sources .mute .mt { flex: 1 1 auto; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
button.mini {
  border: none; background: rgba(255,255,255,0.06); color: var(--text-dim);
  border-radius: 5px; font-size: 10px; padding: 1px 6px; cursor: pointer; flex: none;
}
button.mini:hover { background: rgba(255,255,255,0.14); color: var(--text); }
button.kill { font-size: 12px; line-height: 1; padding: 0 5px; opacity: 0; transition: opacity .12s; }
.nbr:hover button.kill { opacity: 1; }
button.kill:hover { background: rgba(255,120,120,0.22); color: #ffb3b3; }
@media (max-width: 900px) { #sources { display: none; } }
/* 记忆体检：每组一行小标题 + 可点的条目 */
#sources .hy { margin: 2px 0 6px; }
#sources .hy-t {
  font-size: 10px; color: var(--text-dim); letter-spacing: 0.06em;
  padding: 2px 5px; border-left: 2px solid rgba(140, 224, 255, 0.35);
}
#sources .hy-i {
  font-size: 10px; color: var(--text-faint); line-height: 1.4;
  padding: 2px 5px 2px 10px; border-radius: 5px; cursor: pointer;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
#sources .hy-i:hover { background: rgba(140, 224, 255, 0.09); color: var(--text); }
#sources .hy-more { font-size: 9.5px; color: rgba(140, 160, 180, 0.55); padding: 1px 5px 3px 10px; }
.sect { margin-bottom: 12px; }
.sect:last-child { margin-bottom: 0; }
.sect h4 {
  margin: 0 0 6px; font-size: 10px; font-weight: 600;
  letter-spacing: 0.16em; text-transform: uppercase; color: var(--text-faint);
  display: flex; justify-content: space-between; align-items: center;
}
.sect h4 button {
  border: none; background: none; color: var(--text-faint); cursor: pointer;
  font-size: 10px; padding: 0; letter-spacing: 0.06em;
}
.sect h4 button:hover { color: var(--accent); }

.chips { display: flex; flex-wrap: wrap; gap: 5px; }
.chip {
  display: inline-flex; align-items: center; gap: 5px;
  height: 22px; padding: 0 8px;
  border-radius: 7px; font-size: 11px;
  background: rgba(255, 255, 255, 0.03);
  border: 1px solid rgba(150, 180, 220, 0.12);
  color: var(--text-dim); cursor: pointer; user-select: none;
  transition: 0.14s ease;
  white-space: nowrap;
}
.chip:hover { border-color: var(--line-strong); color: var(--text); }
.chip.on { background: rgba(108, 224, 255, 0.13); border-color: rgba(108, 224, 255, 0.4); color: #d6f6ff; }
.chip .n { font-family: var(--mono); font-size: 9.5px; opacity: 0.6; }
.chip .sw { width: 7px; height: 7px; border-radius: 50%; }

.slider { display: flex; align-items: center; gap: 8px; }
input[type='range'] {
  -webkit-appearance: none; appearance: none;
  flex: 1; height: 3px; border-radius: 2px; outline: none;
  background: rgba(140, 170, 210, 0.22);
}
input[type='range']::-webkit-slider-thumb {
  -webkit-appearance: none; width: 11px; height: 11px; border-radius: 50%;
  background: #9fe6ff; cursor: pointer; box-shadow: 0 0 8px rgba(108, 224, 255, 0.8);
}
.slider .val { font-family: var(--mono); font-size: 10.5px; color: var(--text-dim); min-width: 26px; text-align: right; }

/* ============ 右侧详情 ============ */
#detail {
  position: absolute; top: 58px; right: 18px; bottom: 18px;
  width: 372px;
  display: flex; flex-direction: column;
  border-radius: var(--radius);
  background: var(--panel);
  border: 1px solid var(--line);
  box-shadow: var(--shadow);
  backdrop-filter: blur(18px);
  transform: translateX(calc(100% + 24px));
  transition: transform 0.32s cubic-bezier(0.22, 1, 0.36, 1);
  overflow: hidden;
}
#detail.show { transform: none; }

.d-head { padding: 14px 16px 12px; border-bottom: 1px solid var(--line); }
.d-meta { display: flex; gap: 6px; align-items: center; margin-bottom: 8px; flex-wrap: wrap; }
.tag {
  font-size: 10px; padding: 2px 7px; border-radius: 5px;
  font-family: var(--mono); letter-spacing: 0.04em;
  background: rgba(255, 255, 255, 0.05); color: var(--text-dim);
  border: 1px solid rgba(160, 190, 230, 0.12);
}
.d-title { font-size: 15px; line-height: 1.45; font-weight: 600; color: #eef7ff; word-break: break-word; }
.d-imps { display: flex; gap: 3px; margin-top: 8px; }
.d-imps i { width: 16px; height: 3px; border-radius: 2px; background: rgba(255, 255, 255, 0.1); }
.d-imps i.on { background: linear-gradient(90deg, #ffcf7a, #ff9e6b); box-shadow: 0 0 6px rgba(255, 180, 110, 0.5); }

.d-body { flex: 1; overflow: auto; padding: 14px 16px 20px; }
.d-content {
  font-size: 12.5px; line-height: 1.72; color: #c3d3e6; white-space: pre-wrap; word-break: break-word;
}
.d-content mark { background: rgba(108, 224, 255, 0.18); color: #d6f6ff; border-radius: 3px; padding: 0 2px; }
.d-kw { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 14px; }
.d-kw span {
  font-size: 10.5px; padding: 2px 7px; border-radius: 5px; font-family: var(--mono);
  background: rgba(108, 224, 255, 0.07); color: #8fd3ea; border: 1px solid rgba(108, 224, 255, 0.14);
}
.d-sect-title {
  margin: 20px 0 9px; font-size: 10px; letter-spacing: 0.16em; text-transform: uppercase;
  color: var(--text-faint); display: flex; justify-content: space-between;
}
/* 出处：写下这条记忆时主人说的那句话 */
.d-origin {
  position: relative; margin: 0 0 4px; padding: 10px 12px 10px 14px;
  font-size: 12px; line-height: 1.7; color: #cfe0f2; white-space: pre-wrap; word-break: break-word;
  background: linear-gradient(180deg, rgba(255, 216, 138, 0.07), rgba(255, 216, 138, 0.03));
  border-left: 2px solid rgba(255, 216, 138, 0.55); border-radius: 0 8px 8px 0;
}
.d-origin-meta {
  margin-top: 8px; font-size: 10px; font-family: var(--mono);
  color: rgba(255, 216, 138, 0.62); letter-spacing: 0.04em;
}

/* 体检结论：贴在正文上方的一条窄条，避免和出处那块抢注意力 */
.d-hygiene {
  margin: 2px 0 10px; padding: 7px 10px;
  border-radius: 8px; background: rgba(140, 224, 255, 0.06);
  border: 1px solid rgba(140, 224, 255, 0.14);
}
.d-hy-line {
  font-size: 11px; line-height: 1.6; color: rgba(180, 214, 240, 0.86);
}

.nbr {
  display: flex; gap: 9px; padding: 8px; border-radius: 9px; cursor: pointer;
  border: 1px solid transparent; transition: 0.14s ease;
}
.nbr:hover { background: rgba(70, 130, 190, 0.1); border-color: rgba(120, 160, 210, 0.16); }
.nbr .dot { width: 7px; height: 7px; border-radius: 50%; margin-top: 5px; flex: none; }
.nbr .nb { min-width: 0; flex: 1; }
.nbr .nt { font-size: 12px; color: #d7e6f6; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.nbr .nw { font-size: 10.5px; color: #7fa8c4; margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.nbr .bar { height: 2px; border-radius: 2px; margin-top: 5px; background: rgba(255, 255, 255, 0.06); overflow: hidden; }
.nbr .bar i { display: block; height: 100%; border-radius: 2px; }

.acts { display: flex; gap: 7px; margin-top: 16px; flex-wrap: wrap; }

/* ============ 底部图例 ============ */
#legend {
  position: absolute; right: 18px; bottom: 18px;
  display: flex; gap: 14px; align-items: center;
  padding: 9px 14px; border-radius: 11px;
  background: rgba(8, 12, 20, 0.7);
  border: 1px solid var(--line);
  backdrop-filter: blur(12px);
  font-size: 10.5px; color: var(--text-faint);
  transition: opacity 0.3s;
}
#legend .lg { display: flex; align-items: center; gap: 5px; }
#legend .lg i { width: 14px; height: 2px; border-radius: 2px; }
/* 详情面板打开时，图例让位 */
body.has-detail #legend { opacity: 0; pointer-events: none; }

/* ============ 证据链面板（Shift + 点两下节点） ============ */
#pathbar {
  position: absolute; left: 50%; transform: translateX(-50%); bottom: 62px;
  width: min(680px, calc(100vw - 800px)); min-width: 360px;
  padding: 11px 14px 12px; border-radius: 12px; z-index: 41;
  background: rgba(10, 14, 22, 0.94);
  border: 1px solid rgba(255, 216, 138, 0.28);
  box-shadow: 0 18px 48px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.04);
  backdrop-filter: blur(14px);
}
#pathbar[hidden] { display: none; }
#pathbar .pb-head {
  display: flex; align-items: center; justify-content: space-between;
  font-size: 10px; letter-spacing: 0.12em; color: rgba(255, 216, 138, 0.9);
  text-transform: uppercase; margin-bottom: 8px;
}
#pb-close {
  background: none; border: 0; color: var(--text-faint); font-size: 16px; cursor: pointer;
  line-height: 1; padding: 0 2px;
}
#pb-close:hover { color: #ffd88a; }
#pb-body { display: flex; flex-direction: column; gap: 6px; max-height: 30vh; overflow: auto; }
.pb-step {
  display: grid; grid-template-columns: 18px 1fr; gap: 8px; align-items: start;
  font-size: 11.5px; color: #c6d6e6; line-height: 1.45;
}
.pb-n {
  font-family: var(--mono); font-size: 10px; color: #1a1206; background: rgba(255, 216, 138, 0.85);
  border-radius: 3px; text-align: center; line-height: 15px; height: 15px; margin-top: 1px;
}
.pb-l { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pb-edge {
  font-size: 10.5px; color: rgba(255, 216, 138, 0.7); font-family: var(--mono);
  padding-left: 26px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.pb-empty { font-size: 12px; color: #ffb08a; }

/* ============ 状态条 / 提示 ============ */
#toast {
  position: absolute; left: 50%; bottom: 34px; transform: translate(-50%, 12px);  padding: 9px 16px; border-radius: 10px;
  background: rgba(10, 16, 26, 0.94);
  border: 1px solid var(--line-strong);
  box-shadow: var(--shadow);
  font-size: 12px; color: #d8e8f8; opacity: 0;
  pointer-events: none; transition: 0.28s ease; z-index: 40;
}
#toast.show { opacity: 1; transform: translate(-50%, 0); }
#toast.act { pointer-events: auto; display: flex; align-items: center; gap: 10px; }
#toast .t-act {
  flex: 0 0 auto; padding: 3px 9px; border-radius: 7px; cursor: pointer;
  background: rgba(108, 200, 255, 0.14); border: 1px solid rgba(108, 200, 255, 0.34);
  color: #bfe6ff; font-size: 11.5px; font-family: inherit; transition: 0.16s ease;
}
#toast .t-act:hover { background: rgba(108, 200, 255, 0.24); border-color: rgba(108, 200, 255, 0.6); }
#toast .t-act:disabled { opacity: 0.5; cursor: default; }

#hint {
  position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
  text-align: center; color: var(--text-faint); font-size: 13px; letter-spacing: 0.05em;
  display: none;
}
#hint.show { display: block; }
#hint b { display: block; color: var(--text-dim); font-size: 15px; margin-bottom: 8px; font-weight: 500; }

/* 加载骨架 */
#boot {
  position: absolute; left: 50%; top: 46%; transform: translate(-50%, -50%);
  display: flex; flex-direction: column; align-items: center; gap: 16px;
  color: var(--text-dim); font-size: 12px; letter-spacing: 0.14em;
  z-index: 6; pointer-events: none;
  /* 星云长到一半时中心是亮的，浅灰字会糊掉，所以给一块深色底 */
  padding: 18px 26px; border-radius: 14px;
  background: rgba(4, 7, 13, 0.66);
  border: 1px solid rgba(120, 170, 220, 0.12);
  backdrop-filter: blur(6px);
}
/* 失败态要能点：平时 #boot 不吃鼠标（点亮时别挡住画布），出错时再把事件收回来 */
#boot.err { pointer-events: auto; padding: 22px 28px 18px; max-width: min(560px, 78vw); text-align: center; gap: 12px; }
#boot.err .bt { font-size: 13px; color: #ffb08a; letter-spacing: 0.06em; }
#boot.err .bs { font-size: 11.5px; line-height: 1.7; color: var(--text-dim); letter-spacing: 0.02em; }
#boot.err .bs b { color: #cfe6f5; font-weight: 500; }
#boot.err .brow { display: flex; gap: 10px; justify-content: center; margin-top: 2px; flex-wrap: wrap; }
#boot .bretry, #boot .bdiag {
  font: inherit; font-size: 11.5px; letter-spacing: 0.08em; cursor: pointer;
  padding: 7px 16px; border-radius: 9px; color: var(--text);
  background: rgba(24, 40, 60, 0.9); border: 1px solid rgba(120, 200, 230, 0.28);
  transition: background 0.18s ease, border-color 0.18s ease;
}
#boot .bretry:hover, #boot .bdiag:hover { background: rgba(38, 64, 92, 0.95); border-color: rgba(140, 220, 250, 0.45); }
#boot .bretry:disabled { opacity: 0.55; cursor: default; }
#boot details { margin-top: 2px; font-size: 10.5px; color: var(--text-dim); letter-spacing: 0; text-align: left; max-width: 100%; }
#boot details summary { cursor: pointer; opacity: 0.65; list-style: none; text-align: center; }
#boot details summary::-webkit-details-marker { display: none; }
#boot details pre {
  margin: 8px 0 0; padding: 8px 10px; border-radius: 8px; max-height: 140px; overflow: auto;
  background: rgba(0, 0, 0, 0.35); border: 1px solid rgba(120, 170, 220, 0.12);
  font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 10px; line-height: 1.5;
  white-space: pre-wrap; word-break: break-all; color: #9fb4c6;
}
.orbs { display: flex; gap: 9px; }
.orbs i {
  width: 9px; height: 9px; border-radius: 50%; background: #7fd8f5;
  box-shadow: 0 0 12px rgba(108, 224, 255, 0.9);
  animation: pulse 1.25s ease-in-out infinite;
}
.orbs i:nth-child(2) { animation-delay: 0.16s; background: #b48cff; box-shadow: 0 0 12px rgba(180, 140, 255, 0.9); }
.orbs i:nth-child(3) { animation-delay: 0.32s; background: #ffcf7a; box-shadow: 0 0 12px rgba(255, 207, 122, 0.9); }
@keyframes pulse { 0%, 100% { opacity: 0.25; transform: scale(0.7); } 50% { opacity: 1; transform: scale(1.15); } }

/* 区块加载进度（星云在「长」的时候显示） */
.boot-line { letter-spacing: 0.2em; }
.boot-bar {
  width: 210px; height: 2px; border-radius: 2px; overflow: hidden;
  background: rgba(120, 170, 220, 0.14);
}
.boot-bar i {
  display: block; height: 100%; width: 0%;
  background: linear-gradient(90deg, #6cd6ff, #b48cff 60%, #ffcf7a);
  box-shadow: 0 0 10px rgba(120, 200, 255, 0.55);
  transition: width 120ms linear;
}
.boot-num { font-size: 11px; color: rgba(150, 180, 210, 0.62); letter-spacing: 0.1em; }

/* 滚动条 */
::-webkit-scrollbar { width: 7px; height: 7px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: rgba(140, 170, 210, 0.26); border-radius: 4px; }
::-webkit-scrollbar-thumb:hover { background: rgba(140, 170, 210, 0.42); }

/* 窄屏收敛 */
@media (max-width: 1180px) {
  #filters { width: 210px; }
  #detail { width: 330px; }
  #searchwrap { width: 270px; }
}
/* 只在窄屏出现的按钮（默认收起）。必须写在下面的 @media 之前，
   否则同优先级的 display:none 会盖掉媒体查询里的值。 */
.only-narrow { display: none; }

@media (max-width: 900px) {
  /* 窄屏默认收起左列，但不能没有入口：顶栏「筛选」把它抽屉式叫回来 */
  #leftcol { display: none; }
  #leftcol.open {
    display: flex; left: 12px; top: 96px; bottom: 12px; width: 246px;
    z-index: 32; padding-right: 2px;
  }
  #leftcol.open > * { box-shadow: 0 18px 44px rgba(0, 0, 0, 0.55); }
  #detail { width: 300px; }
  .only-narrow { display: inline-flex; }
  /* 880 这类宽度下顶栏最容易挤坏：品牌只留主名，统计收窄间距，按钮压短 */
  #topbar { gap: 10px; padding: 12px 12px; }
  .brand small { display: none; }
  .stat-row { gap: 10px; margin-left: 0; }
  .stat b { font-size: 12.5px; }
  .stat span { font-size: 9px; letter-spacing: 0.02em; }
  /* 只看前三项（记忆 / 连接 / 工作区）；后面两项在窄屏会把标签挤成一团 */
  .stat:nth-child(n+4) { display: none; }
  .btn { padding: 0 10px; }
}

/* 悬停提示 */
#tip {
  position: fixed; z-index: 40; max-width: 300px; pointer-events: none;
  padding: 9px 12px; border-radius: 10px; opacity: 0; transform: translateY(3px);
  transition: opacity 0.12s ease, transform 0.12s ease;
  background: rgba(10, 16, 28, 0.94); border: 1px solid rgba(120, 170, 220, 0.24);
  box-shadow: 0 12px 30px rgba(0, 0, 0, 0.5);
}
#tip.show { opacity: 1; transform: translateY(0); }
#tip .tip-title { font-size: 12.5px; color: #eaf4ff; line-height: 1.45; margin-bottom: 3px; }
#tip .tip-meta { font-size: 10.5px; color: rgba(150, 180, 210, 0.85); letter-spacing: 0.02em; }

/* 快捷键说明浮层（按 ? 开合） */
#keys {
  position: absolute;
  left: 50%;
  top: 50%;
  transform: translate(-50%, -50%);
  z-index: 40;
  min-width: 340px;
  padding: 16px 18px 14px;
  border-radius: 12px;
  background: rgba(8, 12, 20, 0.96);
  border: 1px solid rgba(120, 150, 190, 0.28);
  box-shadow: 0 18px 60px rgba(0, 0, 0, 0.62);
  backdrop-filter: blur(6px);
  cursor: pointer;
}
#keys .keys-t {
  font-size: 12px;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: rgba(150, 180, 215, 0.85);
  margin-bottom: 10px;
}
#keys .keys-row {
  display: flex;
  gap: 14px;
  align-items: baseline;
  padding: 4px 0;
  font-size: 12.5px;
}
#keys .keys-k {
  flex: none;
  min-width: 118px;
  color: #ffd88a;
  font-family: ui-monospace, Menlo, Consolas, monospace;
  font-size: 11.5px;
}
#keys .keys-v {
  color: rgba(210, 224, 240, 0.86);
}

/* 项目卡片：每个工作区一张「交接卡」 */
#boards, #cmdk, #linebar {
  position: absolute;
  z-index: 44;
  border-radius: 14px;
  background: rgba(6, 10, 17, 0.97);
  border: 1px solid rgba(120, 150, 190, 0.3);
  box-shadow: 0 24px 80px rgba(0, 0, 0, 0.72);
  backdrop-filter: blur(8px);
  color: rgba(214, 228, 244, 0.94);
  display: flex;
  flex-direction: column;
}
#boards[hidden], #cmdk[hidden], #linebar[hidden] { display: none; }

#boards {
  left: 50%;
  top: 50%;
  transform: translate(-50%, -50%);
  width: min(860px, calc(100vw - 160px));
  max-height: min(72vh, 700px);
}
#boards .cards-head { display: flex; align-items: center; gap: 12px; padding: 12px 14px 10px; border-bottom: 1px solid rgba(120, 150, 190, 0.18); }
#boards .cards-head > span { font-size: 12px; letter-spacing: 0.14em; color: rgba(180, 205, 232, 0.9); }
#boards #boards-close { margin-left: auto; background: none; border: 0; color: rgba(150, 180, 210, 0.7); font-size: 18px; cursor: pointer; line-height: 1; }
#boards #boards-close:hover { color: #ffd88a; }
.board-tabs { display: flex; gap: 6px; }
.board-tabs .btab {
  background: rgba(120, 160, 210, 0.09);
  border: 1px solid rgba(120, 160, 210, 0.22);
  color: rgba(178, 202, 228, 0.82);
  font-size: 11px;
  padding: 3px 10px;
  border-radius: 999px;
  cursor: pointer;
}
.board-tabs .btab.on { background: rgba(255, 216, 138, 0.16); border-color: rgba(255, 216, 138, 0.5); color: #ffe6b0; }
#boards-body { overflow: auto; padding: 12px 14px 14px; font-size: 12px; line-height: 1.75; }
#boards-body .bd-sec { font-size: 10.5px; letter-spacing: 0.1em; color: rgba(140, 172, 205, 0.72); margin: 10px 0 4px; }
#boards-body .bd-row { display: flex; gap: 8px; padding: 4px 6px; border-radius: 6px; cursor: pointer; border-left: 2px solid transparent; }
#boards-body .bd-row:hover { background: rgba(120, 170, 220, 0.09); border-left-color: rgba(255, 216, 138, 0.7); }
#boards-body .bd-row b { color: rgba(255, 216, 138, 0.88); font-weight: 500; }
#boards-body .bd-dim { color: rgba(145, 168, 196, 0.7); font-size: 11px; }
#boards-body .bd-act { margin-left: auto; font-size: 11px; color: rgba(150, 200, 240, 0.85); }

#cmdk {
  left: 50%;
  top: 14vh;
  transform: translateX(-50%);
  width: min(660px, calc(100vw - 200px));
}
#cmdk-input {
  border: 0;
  border-bottom: 1px solid rgba(120, 150, 190, 0.22);
  background: none;
  color: #e8f1fb;
  font-size: 14px;
  padding: 13px 16px;
  outline: none;
}
#cmdk-list { max-height: min(52vh, 460px); overflow: auto; padding: 6px; }
.cmd {
  display: flex;
  align-items: baseline;
  gap: 8px;
  padding: 7px 10px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 12.5px;
}
.cmd.on { background: rgba(255, 216, 138, 0.14); }
.cmd .cm-k { font-size: 10.5px; letter-spacing: 0.08em; color: rgba(150, 180, 210, 0.75); flex: none; width: 42px; }
.cmd .cm-t { color: rgba(220, 233, 246, 0.95); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cmd .cm-w { margin-left: auto; font-size: 10.5px; color: rgba(140, 168, 198, 0.7); flex: none; }
.cmdk-foot { display: flex; gap: 14px; padding: 8px 14px; border-top: 1px solid rgba(120, 150, 190, 0.16); font-size: 10.5px; color: rgba(140, 168, 198, 0.68); }

#linebar {
  right: 22px;
  bottom: 22px;
  width: min(560px, calc(100vw - 620px));
  max-height: min(64vh, 620px);
}
#linebar .pb-head { margin: 0; padding: 11px 14px; border-bottom: 1px solid rgba(120, 150, 190, 0.18); }
#lb-body { overflow: auto; padding: 10px 14px 14px; font-size: 12px; }
#lb-body .tl { display: flex; gap: 10px; padding: 5px 4px; cursor: pointer; border-radius: 6px; }
#lb-body .tl:hover { background: rgba(120, 170, 220, 0.09); }
#lb-body .tl .t { flex: none; width: 74px; font-size: 10.5px; color: rgba(150, 176, 206, 0.8); font-family: ui-monospace, Menlo, Consolas, monospace; }
#lb-body .tl .d { flex: 1; color: rgba(216, 231, 246, 0.92); }
#lb-body .tl .s { flex: none; font-size: 10.5px; color: rgba(255, 216, 138, 0.8); }
#lb-body .tl.break { margin-top: 8px; border-top: 1px dashed rgba(120, 150, 190, 0.18); padding-top: 9px; }
#lb-body .tl-day {
  font-size: 9.5px; letter-spacing: 0.14em; text-transform: uppercase;
  color: rgba(140, 168, 198, 0.6); margin: 8px 0 2px; padding: 0 4px;
}
#lb-body .tl-day:first-child { margin-top: 0; }
#lb-body .tl.here { background: rgba(108, 200, 255, 0.1); box-shadow: inset 2px 0 0 rgba(108, 200, 255, 0.55); }
#lb-body .tl.here .d { color: #dff2ff; }
#lb-body .tl.here .s { color: #9fe9ff; }

#cards {
  position: absolute;
  left: 50%;
  top: 50%;
  transform: translate(-50%, -50%);
  z-index: 42;
  width: min(1120px, calc(100vw - 120px));
  max-height: min(78vh, 820px);
  display: flex;
  flex-direction: column;
  padding: 14px 16px 12px;
  border-radius: 14px;
  background: rgba(6, 10, 17, 0.97);
  border: 1px solid rgba(120, 150, 190, 0.3);
  box-shadow: 0 24px 80px rgba(0, 0, 0, 0.7);
  backdrop-filter: blur(8px);
}
#cards[hidden] { display: none; }
#cards .cards-head {
  display: flex;
  align-items: baseline;
  gap: 10px;
  padding-bottom: 10px;
  border-bottom: 1px solid rgba(120, 150, 190, 0.16);
}
#cards .cards-head > span {
  font-size: 13px;
  letter-spacing: 0.14em;
  color: #cfe6ff;
}
#cards .cards-head small { color: rgba(150, 180, 210, 0.7); font-size: 11px; }
#cards #cards-close {
  margin-left: auto;
  background: none;
  border: none;
  color: rgba(160, 190, 220, 0.7);
  font-size: 18px;
  line-height: 1;
  cursor: pointer;
}
#cards #cards-close:hover { color: #ffd88a; }
#cards-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(330px, 1fr));
  gap: 12px;
  padding: 12px 2px 4px;
  overflow: auto;
}
.pcard {
  border: 1px solid rgba(120, 150, 190, 0.2);
  border-radius: 11px;
  background: linear-gradient(180deg, rgba(18, 26, 40, 0.9), rgba(10, 15, 24, 0.9));
  padding: 12px 13px 11px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.pcard:hover { border-color: rgba(150, 200, 240, 0.42); }
.pcard .pc-head { display: flex; align-items: baseline; gap: 8px; }
.pcard .pc-title {
  font-size: 13.5px;
  color: #eaf4ff;
  cursor: pointer;
  border-bottom: 1px dotted transparent;
}
.pcard .pc-title:hover { border-bottom-color: rgba(255, 216, 138, 0.7); color: #ffd88a; }
.pcard .pc-n { margin-left: auto; font-size: 11px; color: rgba(150, 180, 210, 0.8); font-family: ui-monospace, Menlo, Consolas, monospace; }
.pcard .pc-meta { display: flex; flex-wrap: wrap; gap: 5px; }
.pcard .pc-tag {
  font-size: 10.5px;
  padding: 1px 6px;
  border-radius: 999px;
  border: 1px solid rgba(120, 150, 190, 0.26);
  color: rgba(190, 212, 238, 0.9);
}
.pcard .pc-sec { font-size: 10.5px; letter-spacing: 0.1em; color: rgba(140, 172, 205, 0.72); margin-top: 2px; }
.pcard .pc-row {
  font-size: 11.5px;
  color: rgba(214, 228, 244, 0.9);
  line-height: 1.5;
  cursor: pointer;
  padding: 2px 0 2px 9px;
  border-left: 2px solid rgba(120, 150, 190, 0.24);
}
.pcard .pc-row:hover { color: #ffe6b0; border-left-color: rgba(255, 216, 138, 0.75); }
.pcard .pc-row b { color: rgba(255, 216, 138, 0.9); font-weight: 500; }
.pcard .pc-empty { font-size: 11px; color: rgba(140, 165, 195, 0.6); }
.pcard .pc-health { display: flex; flex-wrap: wrap; gap: 6px; font-size: 10.5px; }
.pcard .pc-health i {
  font-style: normal;
  padding: 1px 6px;
  border-radius: 999px;
  background: rgba(255, 176, 120, 0.12);
  border: 1px solid rgba(255, 176, 120, 0.3);
  color: #ffc79a;
}

/* 回全视图按钮 + 筛选代价提示 */
#filters .reset-bar { display: flex; flex-direction: column; gap: 5px; margin: 6px 0 2px; }
/* 面板内容比屏幕高时（窄屏 / 类型多），「回全视图」要一直够得着：
   滚过工作区后把它吸在顶部，背景压住下面滑过去的 chips。 */
#filters { scroll-padding-top: 72px; }
#filters .reset-bar {
  position: sticky; top: -14px; z-index: 3;
  margin: 0 -14px 4px; padding: 10px 14px 8px;
  background: linear-gradient(180deg, rgba(9, 15, 26, 0.97) 70%, rgba(9, 15, 26, 0.82));
  backdrop-filter: blur(6px);
}
#filters .chip.reset {
  width: 100%;
  justify-content: center;
  background: rgba(255, 216, 138, 0.12);
  border-color: rgba(255, 216, 138, 0.38);
  color: #ffe6b0;
  font-size: 11.5px;
  padding: 5px 8px;
}
#filters .chip.reset:hover { background: rgba(255, 216, 138, 0.2); }
#filters .filter-hint { font-size: 10.5px; line-height: 1.5; color: rgba(150, 176, 206, 0.75); }
#filters .filter-hint.warn { color: rgba(255, 196, 120, 0.92); }

/* ============ 导出菜单 ============ */
.menu-wrap { position: relative; }
.menu {
  position: absolute; top: calc(100% + 6px); right: 0;
  min-width: 178px; padding: 5px;
  display: flex; flex-direction: column; gap: 2px;
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 10px;
  box-shadow: var(--shadow);
  backdrop-filter: blur(14px);
  z-index: 60;
}
.menu[hidden] { display: none; }
.menu-item {
  text-align: left;
  padding: 7px 10px;
  border: 0; border-radius: 7px;
  background: transparent;
  color: var(--text-dim);
  font-size: 12px; cursor: pointer;
  transition: 0.14s ease;
}
.menu-item:hover { background: rgba(108, 224, 255, 0.1); color: #d6f6ff; }
.menu-check {
  display: flex; align-items: center; gap: 7px;
  margin-top: 3px; padding: 7px 10px 5px;
  border-top: 1px solid var(--line);
  color: var(--text-dim); font-size: 11.5px; cursor: pointer;
  user-select: none;
}
.menu-check input { accent-color: #6ce0ff; margin: 0; }
.menu-check:hover { color: #d6f6ff; }

/* ============ 可折叠分组（左栏） ============ */
.sect > h4 { position: relative; }
.fold {
  margin-left: auto;
  width: 18px; height: 18px;
  display: inline-flex; align-items: center; justify-content: center;
  border: 0; border-radius: 5px;
  background: transparent;
  color: var(--text-faint);
  cursor: pointer;
  transition: 0.18s ease;
}
.fold:hover { color: var(--text); background: rgba(140, 170, 210, 0.1); }
.fold svg { transition: transform 0.22s ease; }
.sect.folded .fold svg,
#sources.folded .fold svg { transform: rotate(-90deg); }
.sect.folded > .chips,
.sect.folded > .slider,
.sect.folded > .filter-hint { display: none; }
.h4-r { display: flex; align-items: center; gap: 6px; }
#sources.folded > #src-list { display: none; }

/* ============ 时间回放（螺旋视图专用） ============ */
#timebar {
  position: absolute; left: 50%; bottom: 16px; transform: translateX(-50%);
  width: min(660px, 56vw);
  display: flex; align-items: center; gap: 12px;
  padding: 9px 16px;
  border-radius: 13px;
  border: 1px solid var(--line);
  background: var(--panel);
  backdrop-filter: blur(14px);
  z-index: 26;
}
#timebar[hidden] { display: none; }
#timebar .tb-label {
  font-size: 10px; letter-spacing: 0.16em; text-transform: uppercase;
  color: var(--text-faint); white-space: nowrap;
}
#timebar .tb-val {
  font-family: var(--mono); font-size: 10.5px; color: var(--text-dim);
  min-width: 96px; text-align: right; white-space: nowrap;
}

/* 详情头部的「复制 id / 会话」：小、可点、不抢标题 */
.tag-btn {
  cursor: pointer; font: inherit; font-size: 10px;
  color: var(--text-faint); background: rgba(255, 255, 255, 0.03);
  border: 1px solid rgba(160, 190, 230, 0.18);
  transition: 0.15s ease;
}
.tag-btn:hover { color: var(--accent); border-color: var(--accent); }

/* 窄屏左列已收起，主线不必再为它让出 620px。
   必须写在基础 #linebar 之后：同优先级下后声明的才生效。 */
@media (max-width: 900px) {
  #linebar { right: 12px; bottom: 12px; width: calc(100vw - 24px); max-height: 58vh; }
}

/* 接口断开时的细提示条：不挡画面，恢复后自己消失 */
#netbar {
  position: absolute; top: 62px; left: 50%; transform: translateX(-50%);
  z-index: 45; pointer-events: none;
  padding: 5px 12px; border-radius: 999px;
  font-size: 10.5px; letter-spacing: 0.06em;
  color: #ffd89a; background: rgba(28, 20, 8, 0.86);
  border: 1px solid rgba(255, 200, 120, 0.34);
  box-shadow: 0 8px 24px rgba(0, 0, 0, 0.45);
  backdrop-filter: blur(8px);
}
#netbar[hidden] { display: none; }
#netbar::before {
  content: ''; display: inline-block; width: 6px; height: 6px; margin-right: 7px;
  border-radius: 50%; background: #ffbc5c; vertical-align: 1px;
  animation: netpulse 1.6s ease-in-out infinite;
}
@keyframes netpulse { 0%, 100% { opacity: 0.35 } 50% { opacity: 1 } }

/* 版本漂移：宿主里还是旧代码时，把「为什么少了功能」说清楚，并给出两条出路 */
#skewbar {
  position: absolute; top: 62px; left: 50%; transform: translateX(-50%);
  z-index: 46; display: flex; align-items: flex-start; gap: 10px;
  max-width: min(780px, calc(100vw - 28px));
  padding: 10px 12px 10px 14px; border-radius: 12px;
  font-size: 11.5px; line-height: 1.65; color: #ffd89a;
  background: rgba(30, 19, 6, 0.94);
  border: 1px solid rgba(255, 184, 92, 0.38);
  box-shadow: 0 12px 34px rgba(0, 0, 0, 0.5);
  backdrop-filter: blur(10px);
}
#skewbar[hidden] { display: none; }
#skewbar b { color: #ffe6bd; font-weight: 600; }
#skewbar code {
  font-family: 'JetBrains Mono', 'Cascadia Mono', Consolas, monospace;
  font-size: 10.5px; padding: 1px 5px; border-radius: 4px;
  background: rgba(255, 255, 255, 0.08); color: #ffe0ae;
  white-space: nowrap;
}
#skew-text { flex: 1; min-width: 0; }
#skew-close {
  flex: none; width: 22px; height: 22px; margin-top: -1px;
  border: 0; border-radius: 6px; cursor: pointer;
  background: transparent; color: #c9a97a; font-size: 16px; line-height: 1;
}
#skew-close:hover { background: rgba(255, 255, 255, 0.09); color: #ffe6bd; }
@media (max-width: 760px) {
  #skewbar { top: 96px; font-size: 11px; padding: 9px 10px 9px 12px; }
  #skewbar code { white-space: normal; word-break: break-all; }
}

/* 示例 / 快照横幅：安静的青色，不抢画布，但一眼能看出「这不是你自己的库」 */
#demobar {
  position: absolute; top: 62px; left: 50%; transform: translateX(-50%);
  z-index: 45; display: flex; align-items: center; gap: 12px;
  max-width: min(720px, calc(100vw - 28px));
  padding: 7px 10px 7px 14px; border-radius: 999px;
  font-size: 11.5px; letter-spacing: 0.03em; color: #a9e7ff;
  background: rgba(6, 22, 32, 0.92);
  border: 1px solid rgba(108, 224, 255, 0.34);
  box-shadow: 0 10px 30px rgba(0, 0, 0, 0.45);
  backdrop-filter: blur(10px);
}
#demobar[hidden] { display: none; }
#demo-text { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#demo-text b { color: #d9f6ff; font-weight: 600; }
#demo-exit {
  flex: none; border: 1px solid rgba(108, 224, 255, 0.3); border-radius: 999px;
  padding: 4px 11px; cursor: pointer;
  background: rgba(108, 224, 255, 0.1); color: #cdefff; font-size: 11px; line-height: 1.3;
}
#demo-exit:hover { background: rgba(108, 224, 255, 0.2); border-color: rgba(108, 224, 255, 0.55); }
#demo-exit[hidden] { display: none; }
/* 820–1180 之间顶栏只有一行，但搜索框仍在顶部：模式条必须让到它下面 */
@media (max-width: 1180px) {
  #demobar { top: 100px; }
}
@media (max-width: 760px) {
  #demobar { top: 142px; font-size: 11px; }
  #demo-text { white-space: normal; }
}

/* 空库引导：不是一句「这里还没有星星」，而是三条能走的路 */
#hint.empty { display: block; width: min(430px, calc(100vw - 44px)); }
#hint .hcard {
  text-align: left; padding: 22px 24px 18px;
  border-radius: 16px; background: rgba(6, 10, 18, 0.82);
  border: 1px solid rgba(120, 170, 220, 0.16);
  box-shadow: 0 24px 60px rgba(0, 0, 0, 0.5);
  backdrop-filter: blur(8px);
}
#hint .hcard b { margin-bottom: 4px; font-size: 15px; }
#hint .hcard .hsub { color: var(--text-faint); font-size: 11.5px; letter-spacing: 0.02em; margin-bottom: 14px; }
#hint .hopt { display: flex; gap: 10px; padding: 8px 0; font-size: 12px; line-height: 1.65; color: var(--text-dim); }
#hint .hopt .hn { flex: none; width: 18px; color: #6ce0ff; font-variant-numeric: tabular-nums; }
#hint .hact, .hit-empty .hact { display: flex; gap: 8px; margin-top: 14px; }
.hit-empty .hact { margin-top: 9px; flex-wrap: wrap; }
#hint .hbtn, .hit-empty .hbtn {
  border: 1px solid rgba(108, 224, 255, 0.34); border-radius: 8px;
  padding: 7px 14px; cursor: pointer; font-size: 12px;
  background: rgba(108, 224, 255, 0.1); color: #cdefff;
}
#hint .hbtn:hover, .hit-empty .hbtn:hover { background: rgba(108, 224, 255, 0.2); }
#hint .hbtn.ghost, .hit-empty .hbtn.ghost { background: transparent; border-color: rgba(120, 170, 220, 0.22); color: var(--text-dim); }
#hint .hbtn.ghost:hover, .hit-empty .hbtn.ghost:hover { border-color: rgba(120, 170, 220, 0.42); color: var(--text); }


/* 重建中：图标原地转，按钮同时是 disabled（点不动） */
.btn.busy { opacity: .72; }
.btn.busy svg { animation: nbspin 1.1s linear infinite; }
@keyframes nbspin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .btn.busy svg { animation: none; } }

/* 说明面板底部一行：版本与边界 */
.keys-f { margin-top: 10px; padding-top: 8px; border-top: 1px solid rgba(120,160,210,.16);
  font-size: 10px; letter-spacing: .04em; color: var(--dim, #6b7d93); }
.keys-re, .keys-diag {
  margin-top: 12px; padding: 7px 12px;
  border: 1px solid rgba(108, 224, 255, 0.26); border-radius: 8px;
  background: rgba(108, 224, 255, 0.08); color: #bfeaff;
  font-size: 11.5px; cursor: pointer;
}
.keys-re:hover, .keys-diag:hover { background: rgba(108, 224, 255, 0.18); }
.keys-diag { margin-left: 8px; color: #9fc7dd; }

/* ============ 新手三步 ============ */
#onboard {
  position: fixed; left: 300px; bottom: 96px; width: 372px;
  z-index: 48; padding: 14px 16px 12px;
  background: rgba(6, 10, 18, 0.9);
  border: 1px solid rgba(108, 224, 255, 0.22);
  border-radius: 14px;
  box-shadow: 0 22px 60px rgba(0, 0, 0, 0.55);
  backdrop-filter: blur(12px);
  animation: hud-in 0.4s cubic-bezier(0.22, 1, 0.36, 1) both;
}
.onboard .ob-head {
  display: flex; align-items: center; gap: 10px;
  padding-bottom: 8px; border-bottom: 1px solid rgba(120, 170, 220, 0.14);
}
.onboard .ob-head b { font-size: 13.5px; color: #e6f6ff; font-weight: 600; letter-spacing: .01em; }
.onboard .ob-x {
  margin-left: auto; width: 24px; height: 24px; border: 0; border-radius: 6px;
  background: transparent; color: #7e94aa; font-size: 17px; line-height: 1; cursor: pointer;
}
.onboard .ob-x:hover { background: rgba(120, 170, 220, 0.12); color: #d9f2ff; }
.onboard .ob-step {
  display: grid; grid-template-columns: 22px 1fr auto; gap: 9px; align-items: start;
  padding: 10px 0; border-bottom: 1px solid rgba(120, 170, 220, 0.08);
}
.onboard .ob-step:last-of-type { border-bottom: 0; }
.onboard .ob-n {
  width: 20px; height: 20px; margin-top: 1px; border-radius: 50%;
  display: grid; place-items: center;
  background: rgba(108, 224, 255, 0.14); color: #9fe4ff;
  font-size: 10.5px; font-variant-numeric: tabular-nums;
}
.onboard .ob-copy { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.onboard .ob-copy b { font-size: 12px; color: #d8eefb; font-weight: 550; }
.onboard .ob-copy span { font-size: 10.8px; line-height: 1.55; color: #7f94a9; }
.onboard .ob-act {
  border: 1px solid rgba(108, 224, 255, 0.3); border-radius: 7px;
  padding: 5px 10px; background: rgba(108, 224, 255, 0.08);
  color: #bfeaff; font-size: 10.8px; cursor: pointer; white-space: nowrap;
}
.onboard .ob-act:hover { background: rgba(108, 224, 255, 0.18); }
.onboard .ob-step.done .ob-n { background: rgba(120, 220, 170, 0.18); color: #9ff0c4; }
.onboard .ob-step.done .ob-act { opacity: .55; }
.onboard .ob-foot {
  display: flex; align-items: center; gap: 10px;
  margin-top: 9px; padding-top: 9px; border-top: 1px solid rgba(120, 170, 220, 0.14);
}
.onboard .ob-skip {
  border: 0; background: transparent; color: #8ba3b8; font-size: 11px;
  padding: 3px 0; cursor: pointer; text-decoration: underline; text-underline-offset: 3px;
}
.onboard .ob-skip:hover { color: #cfe9f8; }
.onboard .ob-foot span { margin-left: auto; color: #5f7488; font-size: 10px; }

@media (max-width: 900px) {
  #onboard { left: 12px; right: 12px; width: auto; bottom: 84px; }
}
@media (max-width: 760px) {
  #onboard { bottom: 76px; padding: 12px 12px 10px; }
  .onboard .ob-copy span { font-size: 10.4px; }
}

/* 键盘可达：只在真的用键盘走位时亮一圈，不打扰鼠标用户 */
:where(.btn, .chip, .btab, .menu-item, .tag-btn, .t-act, .bd-act, .fold, .hit, .pcard):focus-visible {
  outline: 1.5px solid rgba(108, 224, 255, .75);
  outline-offset: 2px;
}


/* ==========================================================================
   精修层 —— 不换风格，只把「贵」的细节补上：
   ① 等宽数字，统计不抖；② 面板内高光与统一缓动；③ chip 选中发光；
   ④ 滚动条收细；⑤ 首屏一次性入场；⑥ 无动效偏好时全部关掉。
   ========================================================================== */

html, body {
  font-family: 'Inter', 'PingFang SC', 'HarmonyOS Sans SC', 'Microsoft YaHei UI', 'Microsoft YaHei', system-ui, -apple-system, sans-serif;
  font-feature-settings: 'ss01' 1, 'cv01' 1;
  text-rendering: optimizeLegibility;
}

.stat b, .chip .n, .slider .val, .hit .m, .src .n, .brand small, .kbd {
  font-variant-numeric: tabular-nums;
  font-feature-settings: 'tnum' 1;
}

/* 面板：一条极淡的内高光，让玻璃有厚度；hover 不改尺寸，只亮边 */
#filters, #sources, #detail, #legend, #cards, #boards {
  box-shadow: var(--shadow), inset 0 1px 0 rgba(255, 255, 255, 0.045);
}

#filters, #sources {
  transition: border-color 0.22s ease, box-shadow 0.22s ease;
}
#filters:hover, #sources:hover {
  border-color: rgba(150, 190, 235, 0.22);
}

/* 顶栏统计：hover 时数字提亮，点上去有「这是活的」的感觉 */
.stat { transition: transform 0.18s ease; }
.stat:hover { transform: translateY(-1px); }
.stat b { transition: color 0.18s ease, text-shadow 0.18s ease; }
.stat:hover b { color: #fff; text-shadow: 0 0 14px rgba(108, 224, 255, 0.45); }

/* 按钮：统一缓动 + 按下回弹 + 键盘可达 */
.btn {
  transition: color 0.16s ease, border-color 0.16s ease, background 0.16s ease,
              transform 0.12s ease, box-shadow 0.18s ease;
}
.btn:hover { transform: translateY(-1px); box-shadow: 0 6px 18px rgba(0, 0, 0, 0.32); }
.btn:active { transform: translateY(0) scale(0.985); }
.btn:focus-visible {
  outline: none;
  box-shadow: 0 0 0 2px rgba(108, 224, 255, 0.55), 0 0 18px rgba(108, 224, 255, 0.25);
}

/* 搜索框：聚焦时像被点亮，而不只是换个边框色 */
.searchbox { transition: border-color 0.2s ease, box-shadow 0.24s ease; }
.searchbox:focus-within {
  border-color: rgba(108, 224, 255, 0.55);
  box-shadow: 0 0 0 3px rgba(108, 224, 255, 0.1), 0 0 26px rgba(108, 224, 255, 0.16), var(--shadow);
}

/* chip：选中时内发光 + 权重变高；数量徽章对齐更稳 */
.chip { transition: 0.14s ease, box-shadow 0.2s ease; }
.chip:hover { transform: translateY(-1px); }
.chip:active { transform: translateY(0) scale(0.98); }
.chip.on {
  box-shadow: inset 0 0 0 1px rgba(108, 224, 255, 0.12), 0 0 14px rgba(108, 224, 255, 0.1);
}
.chip.on .n { opacity: 0.85; }
.chip .sw { box-shadow: 0 0 6px currentColor; }

/* 滚动条：细到几乎看不见，hover 才显形 */
#filters, #sources, #detail .d-body, #boards-body, #cards-grid, #hits, #cmdk-list {
  scrollbar-width: thin;
  scrollbar-color: rgba(140, 170, 210, 0.28) transparent;
}
#filters::-webkit-scrollbar, #sources::-webkit-scrollbar,
#detail .d-body::-webkit-scrollbar, #boards-body::-webkit-scrollbar,
#cards-grid::-webkit-scrollbar, #hits::-webkit-scrollbar, #cmdk-list::-webkit-scrollbar {
  width: 6px; height: 6px;
}
#filters::-webkit-scrollbar-thumb, #sources::-webkit-scrollbar-thumb,
#detail .d-body::-webkit-scrollbar-thumb, #boards-body::-webkit-scrollbar-thumb,
#cards-grid::-webkit-scrollbar-thumb, #hits::-webkit-scrollbar-thumb, #cmdk-list::-webkit-scrollbar-thumb {
  background: rgba(140, 170, 210, 0.24);
  border-radius: 99px;
}
#filters::-webkit-scrollbar-thumb:hover, #detail .d-body::-webkit-scrollbar-thumb:hover {
  background: rgba(160, 200, 240, 0.42);
}
#filters::-webkit-scrollbar-track, #detail .d-body::-webkit-scrollbar-track { background: transparent; }

/* 详情面板：顶部一条会呼吸的渐变线，把「这是当前焦点」说出来 */
#detail::before {
  content: '';
  position: absolute; left: 14px; right: 14px; top: 0; height: 1px;
  background: linear-gradient(90deg, transparent, rgba(108, 224, 255, 0.55), rgba(180, 140, 255, 0.35), transparent);
  opacity: 0.75;
  pointer-events: none;
}
#detail { position: absolute; }

/* 搜索命中 / 邻居行：hover 时左侧亮一条，扫读时眼睛有落点 */
.hit, .nbr { position: relative; }
.hit::before, .nbr::before {
  content: ''; position: absolute; left: 0; top: 6px; bottom: 6px; width: 2px;
  border-radius: 2px; background: linear-gradient(180deg, #6ce0ff, #b48cff);
  opacity: 0; transition: opacity 0.16s ease;
}
.hit:hover::before, .hit.active::before, .nbr:hover::before { opacity: 0.9; }

/* 图例：hover 提亮，帮助「这一色是什么」 */
#legend > * { transition: color 0.16s ease, background 0.16s ease; }
#legend > *:hover { background: rgba(108, 224, 255, 0.06); }

/* 首屏入场：只播一次，随后交给交互本身 */
#topbar, #searchwrap { animation: hud-in 0.5s cubic-bezier(0.22, 1, 0.36, 1) both; }
#leftcol { animation: hud-in 0.55s cubic-bezier(0.22, 1, 0.36, 1) 0.06s both; }
#legend { animation: hud-in 0.55s cubic-bezier(0.22, 1, 0.36, 1) 0.12s both; }

@keyframes hud-in {
  from { opacity: 0; transform: translateY(-6px); }
  to { opacity: 1; transform: translateY(0); }
}

/* 焦点可见性：键盘用户才看得到描边，鼠标用户看不到 */
button:focus-visible { outline: 2px solid rgba(108, 224, 255, 0.6); outline-offset: 2px; }

/* 矮屏（≤820px 高）：720p 的笔记本上左栏装不下四组筛选。
   先把间距和字号收一档、把「只读」那句说明收起来，四组就都看得见；
   再矮下去 #filters 自身有 overflow:auto，「重建筛选」那条是 sticky 的，滚得回来。 */
@media (max-height: 920px) {
  #leftcol { top: 96px; bottom: 12px; gap: 8px; }
  #sources { padding: 9px 11px; max-height: none; }
  #src-list { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0 12px; }
  #src-list .dim { display: none; }
  .sect { margin-bottom: 9px; }
  .sect h4 { margin: 0 0 5px; font-size: 10px; }
  .chips { gap: 4px; }
  .chip { height: 21px; font-size: 11px; }
  .stat { padding: 0; }
  .searchbox { height: 34px; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.001ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.001ms !important;
  }
}

.seed-note { margin-top: 7px; font-size: 10.5px; line-height: 1.5; color: var(--text-faint); }

/* ============ English：更长的标签需要一点呼吸 ============ */
html.lang-en #topbar { gap: 10px; padding-left: 12px; padding-right: 12px; }
html.lang-en .brand b { font-size: 14px; letter-spacing: 0.1em; }
html.lang-en .stat-row { gap: 11px; margin-left: 2px; }
html.lang-en .stat span { font-size: 9px; letter-spacing: 0.02em; }
html.lang-en #sources .src .n { font-size: 9px; }
html.lang-en #keys { min-width: 560px; max-width: min(760px, 92vw); }
html.lang-en #keys .keys-k { flex: 0 0 190px; min-width: 190px; }
html.lang-en #keys .keys-v { font-size: 12px; }
html.lang-en .brand small { display: none; }
html.lang-en .stat { min-width: 64px; }
html.lang-en .stat-row { gap: 12px; }

</style>

<script>window.__NEBULA_SNAPSHOT__ = {"version":"1.6.4","build":1794513625140,"builtAt":1794513625229,"sig":"demo-v1-snapshot","scope":{"kind":"all","value":"","label":"整张星图","hops":0,"hidden":0,"hide":[],"nodes":64,"edges":78},"graph":{"v":2,"nodes":[["xg-vision","星港产品","xingang","topic","「星港」是什么：一个离线优先的写作台",4,"active","星港",21,0.99,3,1789156825123,"demo","demo",0.8847424469422549,"星港是一个离线优先的笔记应用：所有数据留在本地，不注册账号、不上传云端。核心场景是「一个人长期写东西」，所以它更像工作台而不是收藏夹——搜索、双链、版本历史都必须能离线工作。项目从 2025 年冬天开始，目标用户是写作者和独立开发者。"],["xg-local","星港产品","xingang","rules","星港只做本地优先，不做云同步",4,"active","星港",14,0.985,2,1791662425123,"demo","demo",0.19474649941548705,"这是一条边界，不是偏好：星港不提供云同步，也不做「可选登录」。用户原话是「我不想注册账号」。可以做的是一键导出、局域网直连、用户自己选网盘同步文件夹；不能做的是把数据先传到我们的服务器再发回来。"],["xg-search","星港产品","xingang","topic","搜索策略：先关键词，后语义",3,"active","星港",9,0.879,2,1792267225123,"demo","demo",0.12784456997178495,"星港的搜索分两层：第一层是 FTS5 全文关键词，保证「搜得到」；第二层才是向量语义，用来解决「记得意思但想不起原话」。顺序不能反——语义搜索在没有结果时很难解释为什么没结果，而关键词能给出明确的空状态。memory-nebula 的检索也是这个思路，先关键词打分再沿图扩散。"],["xg-index","星港产品","xingang","fact","索引文件叫 xingang.idx",2,"active","星港",4,0.754,2,1792785625123,"demo","demo",0.9557997726369649,"星港的全文索引单独落一个文件 `xingang.idx`，和主库 `xingang.db` 放在同一目录。删掉索引不会丢笔记，下次启动会重建；备份时两个文件要一起拷，否则第一次搜索会慢几秒。"],["xg-merge","星港产品","xingang","todo","下个版本做离线冲突合并",3,"active","星港",2,0.801,2,1793476825123,"demo","demo",0.07334662531502545,"两台设备各自改同一条笔记时，现在会保留两个版本让人手选。下个版本要做三方合并：以最后一次共同版本为基准，段落级 diff，冲突段落标黄。验收标准是「两台机器断网各改三段，恢复网络后不丢任何一段」。"],["xg-quote","星港产品","xingang","quotes","用户原话：我不想注册账号",3,"active","星港",3,0.82,1,1793217625123,"demo","demo",0.9192169087473303,"访谈里用户说：「我不想注册账号，你们要是让我登录，我就还用备忘录。」这句话后来变成了产品原则的第一条。"],["xg-sync-bug","星港产品","xingang","fact","局域网同步偶尔丢包",3,"active","星港",5,0.846,2,1793736025123,"demo","demo",0.3086022052448243,"复现步骤：两台机器连同一个 Wi-Fi，改 20 条以上笔记后立刻休眠其中一台，再唤醒时偶发 1-2 条不同步。初步判断是 UDP 广播包在休眠期间丢失，且没有补拉机制。临时规避是唤醒后手动点一次「重新同步」。"],["xg-icon","星港产品","xingang","fact","星港的图标是一架纸飞机",1,"active","星港",0,0.461,1,1790971225123,"demo","demo",0.41557821398600936,"图标是一架朝右上的纸飞机，取自「把写好的东西送出去」的意思。草稿在设计的 Figma 里，最终版去掉了尾迹线，只留机身。"],["xg-sqlite","星港产品","xingang","topic","数据格式为什么选 SQLite 而不是 JSON",4,"active","星港",8,0.952,5,1791403225123,"demo","demo",0.11203013430349529,"为什么星港的数据格式最后选了 SQLite，而不是把笔记存成一堆 JSON 文件。\n\n一、写入原子性。笔记应用最怕的是「写了一半断电」，JSON 文件要么整份重写、要么留下半截；SQLite 的 WAL 让一次写入要么完整可见、要么完全不存在，这对本地优先的产品是底线。\n\n二、查询。想做「这个标签下最近改过的 20 条」，JSON 方案得把整个目录读进内存再排序；SQLite 一条带索引的 SQL 就够了。星港的索引文件叫 `xingang.idx`，里面就是 FTS5 的全文索引。\n\n三、迁移。schema 变更用 migration 脚本按版本号顺序跑，失败就回滚；JSON 方案要自己写「读到旧字段怎么办」的兼容层，半年后没人敢动。\n\n四、代价。SQLite 不是零成本：并发写要靠单写者队列，跨进程要小心锁；移动端还要处理 WAL 文件随包拷贝的问题。所以星港的规则是——只有一个写进程，其它进程只读。\n\n五、不选 LevelDB / RocksDB 的原因：它们适合 KV，不适合「按标签、按时间、按全文」这种关系型查询；而且原生依赖会让「单文件二进制」的发布方式变复杂。\n\n结论：SQLite 作为唯一真相源，导出功能负责把数据还成人类可读的 Markdown。迁移脚本必须和 schema 版本一起进仓库，任何一次发布前都要在旧库副本上跑一遍。\n\n补充（2026-11 复盘）：真正麻烦的是「用户在不同版本之间来回装」。降级安装会碰到「库比程序新」的表结构，程序不认识新列，直接报错。现在的策略是启动时先读 schema 版本：比程序新就拒绝写入、只允许导出，提示「请升级到更新版本，或先导出备份」。这条规则写进了发布检查清单，比任何迁移脚本都重要——迁移能补数据，补不回用户的信任。"],["xg-migrate","星港产品","xingang","todo","补一个迁移脚本的回归测试",2,"active","星港",0,0.631,1,1793995225123,"demo","demo",0.42300924751907587,"每次 schema 变更都要在旧库副本上跑一遍迁移。现在只有手工验证，要补一个脚本：拿 v1、v2 两个样例库，跑完迁移后对比表结构和关键行数。"],["xg-weekly","星港产品","xingang","fact","周会纪要（长期）",1,"active","星港",0,0.565,11,1794254425123,"demo","demo",0.8424542285501957,"每周三晚八点，四个人同步一次进度。纪要不进项目文档，只留在这里；讨论到具体决定时，会另开一条记忆写清楚「为什么」。"],["xg-partner-a","星港产品","xingang","fact","阿澈负责同步层",2,"active","星港",3,0.74,3,1792440025123,"demo","demo",0.09705302701331675,"阿澈写同步层，重点是冲突检测。他习惯先写失败用例再写实现，所以同步相关的测试比功能代码还多。"],["xg-partner-b","星港产品","xingang","fact","林禾负责编辑器",2,"active","星港",2,0.721,2,1792526425123,"demo","demo",0.08533399552106857,"林禾管编辑器：光标、选区、输入法、撤销栈。她说编辑器的 bug 有一半是输入法时序问题，复现要靠录屏。"],["xg-partner-c","星港产品","xingang","fact","老周负责发布",2,"active","星港",1,0.695,4,1792612825123,"demo","demo",0.08924033935181797,"老周管发布：打包、签名、更新通道。他的原则是「发布脚本要能在断网机器上跑完」，所以依赖全部本地化。"],["xg-deploy","星港产品","xingang","fact","星港的发布流程沿用运维台那一套",2,"active","星港",2,0.721,3,1792958425123,"demo","demo",0.8792644506320357,"打包成单文件二进制、算校验和、先发内测通道、观察一天再全量。和运维台的发布流程一致，区别只是星港面向普通用户，回滚要更快。"],["xg-voice-note","星港产品","xingang","todo","星港要内置语音速记",2,"active","星港",1,0.695,2,1793563225123,"demo","demo",0.6404981012456119,"需求：按住说话，本地转文字，插到当前光标处。语音模型走语音实验室验证过的那条链路，不联网。难点是包体——模型量化后仍有 80MB，要考虑按需下载。"],["xg-color","星港产品","xingang","fact","星港的界面配色直接复用设计系统",2,"active","星港",3,0.74,5,1792872025123,"demo","demo",0.7215845747850835,"主色「夜航蓝」，背景暖沙，圆角 14px。星港不单独维护一套视觉，设计系统改了它就跟着改。"],["xg-dark","星港产品","xingang","fact","深色模式不是反色",2,"active","星港",2,0.721,2,1793044825123,"demo","demo",0.9846321006771177,"深色模式单独调过：背景不是纯黑，是带一点蓝的 #0e1520；正文不用纯白，用 #e6e9ef。直接反色会让图片发灰。"],["xg-shortcut","星港产品","xingang","fact","快捷键：Cmd+K 是命令面板",1,"active","星港",1,0.615,2,1792094425123,"demo","demo",0.277890206547454,"命令面板统一入口，搜索、跳转、新建都从这里走。Windows 上是 Ctrl+K。冲突检测在设置页可查。"],["xg-empty","星港产品","xingang","fact","空状态文案改过三次",1,"active","星港",0,0.472,1,1791576025123,"demo","demo",0.7275878200307488,"第一版是「开始写点什么吧」，太轻；第二版是「你的第一条笔记」，太像教程；第三版是「写下一句话，它会留在这里」，保留了。"],["xg-coact","星港产品","xingang","fact","茶水间闲聊：键盘手感",1,"active","星港",0,0.543,1,1793822425123,"demo","demo",0.018913198029622436,"机械键盘换回薄膜键盘，打字速度没变，肩膀不酸了。"],["xg-c1","星港产品","xingang","fact","白板照片：同步状态机",1,"active","星港产品",0,0.502,1,1792785625123,"demo","demo",0.18413637368939817,"白板上画了四态：空闲、发送中、等待确认、冲突。拍照存档。"],["xg-c2","星港产品","xingang","fact","内测名单第 3 批",1,"active","星港产品",1,0.615,1,1793131225123,"demo","demo",0.18804271752014756,"第 3 批内测 40 人，主要是写作者和两名独立开发者。"],["xg-c3","星港产品","xingang","todo","补一个导出 Markdown 的用例",1,"active","星港产品",0,0.52,3,1793304025123,"demo","demo",0.19194906135089695,"导出时要保留标题层级和代码块语言标记，图片落 assets 目录。"],["xg-c4","星港产品","xingang","fact","崩溃日志：输入法候选框",1,"active","星港产品",2,0.641,1,1793390425123,"demo","demo",0.1646046545356512,"候选框位置在外部显示器上偏移 12px，只在缩放 125% 时出现。"],["xg-c5","星港产品","xingang","fact","字体子集化省了 9MB",1,"active","星港产品",1,0.615,2,1792699225123,"demo","demo",0.1685109983664006,"中文全量字体 12MB，按常用 3500 字子集化后 3MB。"],["xg-c6","星港产品","xingang","fact","备份目录约定",1,"active","星港产品",0,0.485,2,1792180825123,"demo","demo",0.17241734219715,"用户数据目录下 backups/ 保留最近 7 份，每份是完整拷贝。"],["xg-c7","星港产品","xingang","fact","键盘导航草案",1,"active","星港产品",0,0.49,2,1792353625123,"demo","demo",0.17632368602789938,"列表用 j/k，进入用 Enter，返回用 Esc，和常见阅读器一致。"],["xg-c8","星港产品","xingang","fact","埋点只记本地",2,"active","星港产品",1,0.695,2,1792008025123,"demo","demo",0.14897927921265364,"不接第三方统计，事件写本地表，用户可在设置里导出或清空。"],["xg-c9","星港产品","xingang","fact","图标导出尺寸表",1,"active","星港产品",0,0.477,4,1791835225123,"demo","demo",0.15288562304340303,"16/32/64/128/256/512 六档，Windows 用 ico 打包。"],["xg-c10","星港产品","xingang","fact","版本号规则",1,"active","星港产品",1,0.615,3,1791489625123,"demo","demo",0.7342978429514915,"主版本看数据格式，次版本看功能，修订号只修 bug。"],["ds-palette-v1","设计系统","design","decision","配色方案 v1：深蓝 + 米白",2,"active","设计系统",0,0.535,4,1790539225123,"demo","demo",0.26237972918897867,"主色深蓝 #1f3a5f，背景米白 #f5f1e8，强调色赭石。整体偏纸感，适合长时间阅读。"],["ds-palette-v2","设计系统","design","decision","配色方案 v2：夜航蓝 + 暖沙",3,"active","设计系统",6,0.856,2,1792958425123,"demo","demo",0.27409876068122685,"v1 的深蓝在低亮度屏幕上发闷，换成夜航蓝 #24405f；米白偏黄，换成暖沙 #f3ede2。强调色从赭石改成珊瑚橙，用于「当前选中」这种需要跳出来的状态。"],["ds-radius","设计系统","design","fact","圆角统一 14px",2,"active","设计系统",3,0.74,2,1792612825123,"demo","demo",0.3535796639043838,"卡片 14px、按钮 10px、输入框 10px。例外是头像，永远圆形。"],["ds-border","设计系统","design","decision","面板不用阴影，用 1px 描边",3,"active","设计系统",4,0.834,2,1793131225123,"demo","demo",0.08682497614063323,"阴影在深色背景上会脏，改用 1px 内描边加一层极淡的外发光。层次靠背景明度差，不靠投影。"],["ds-overflow","设计系统","design","fact","窄屏下侧栏会溢出",2,"active","设计系统",1,0.695,2,1793649625123,"demo","demo",0.37000680644996464,"宽度小于 860px 时，左侧来源列表的最后一个字会被裁掉。原因是 flex 子项没有 min-width:0。"],["ds-type","设计系统","design","fact","字体：思源黑体 + 霞鹜文楷",2,"active","设计系统",2,0.721,1,1791662425123,"demo","demo",0.9117422138806432,"界面用思源黑体，长文阅读可切换霞鹜文楷。两份字体都做了子集化，合计约 5MB。"],["ds-empty","设计系统","design","quotes","空状态插画草稿",1,"active","设计系统",0,0.52,2,1793304025123,"demo","demo",0.07911136094480753,"草稿三版：一盏没点的灯、一张空白稿纸、一片星云。最后选了星云，因为「还没亮起来」比「什么都没有」更接近空库的真实状态。"],["ds-skill","设计系统","design","lesson","视觉评审用 huashu-design 先出三个方向",2,"active","设计系统",2,0.721,3,1793476825123,"demo","demo",0.013637213967740536,"任何新界面先出三个方向再选，不要一上来就精修一个方案。三个方向要真的不同：一个克制、一个大胆、一个偏实验。评审时只看方向，不看细节。"],["vc-cosy","语音实验室","voice","decision","语音链路选 CosyVoice",3,"active","语音链路",5,0.846,3,1791921625123,"demo","demo",0.29340767371468246,"中文母语训练、零样本克隆、48k 输出，本地推理可接受。对比过三家：另外两家音色更亮，但中文多音字错得更多。"],["vc-rvc","语音实验室","voice","lesson","RVC 中文卷舌是架构问题，不是调参能修的",3,"active","语音链路",4,0.834,3,1792267225123,"demo","demo",0.47837206022813916,"RVC 的内容特征走 ContentVec，中文卷舌音在特征层就被压平了，后面再怎么调都救不回来。要卷舌清楚，得换内容编码器，不是换声码器。"],["vc-rate","语音实验室","voice","fact","采样率统一 48k",2,"active","语音链路",2,0.721,1,1792440025123,"demo","demo",0.20221650484018028,"训练、推理、混音统一 48k，避免三次重采样。旧素材 44.1k 的先重采样再入库。"],["vc-tts-bug","语音实验室","voice","fact","TTS 长句断句错",2,"active","语音链路",3,0.74,2,1793563225123,"demo","demo",0.19325257861055434,"超过 60 字的长句偶尔在「的」后面断开，听起来像换气。临时方案是前端按标点先切句，每句不超过 40 字。"],["vc-dialect","语音实验室","voice","todo","做一版方言音色",1,"active","语音链路",0,0.555,2,1794081625123,"demo","demo",0.7517079862300307,"先做四川话，找母语者录 20 分钟干净素材。验收标准是本地人听了不觉得是「普通话变调」。"],["vc-quote","语音实验室","voice","quotes","主人原话：「先别动我的声线」",3,"active","语音链路",3,0.82,3,1793390425123,"demo","demo",0.8047078072559088,"调音色那次，主人说「先别动我的声线」。后来明白这不是技术意见，是边界：可以改实现，不能改「听起来是谁」。"],["op-binary","运维台","ops","decision","部署用单文件二进制",3,"active","运维",6,0.856,2,1790193625123,"demo","demo",0.29373787250369787,"发布物是一个可执行文件加一个数据目录，没有运行时依赖。升级就是替换文件、重启进程、跑迁移。"],["op-port","运维台","ops","fact","7890 是星图引擎的默认端口",2,"active","运维",4,0.754,3,1792699225123,"demo","demo",0.17070367326959968,"独立引擎默认监听 127.0.0.1:7890，宿主内嵌模式走宿主的端口。端口冲突时用 --port 换一个。"],["op-restart","运维台","ops","lesson","不要自动重启宿主进程",4,"active","运维",5,0.926,3,1792872025123,"demo","demo",0.5622870726510882,"曾经用脚本延迟杀进程再拉起，结果应用直接打不开。重启会把正在进行的会话掐断，代价由用户付。改动需要重启时，只提示，不代劳。"],["op-checksum","运维台","ops","todo","给快照加校验和",2,"active","运维",0,0.627,2,1793908825123,"demo","demo",0.7588586402125657,"导出的单文件快照要带 sha256，导入前先校验：文件被聊天软件改过、截断过，要能明确报错，而不是渲染一半白屏。"],["op-path","运维台","ops","fact","Windows 路径带空格会启动失败",2,"active","运维",2,0.721,3,1793822425123,"demo","demo",0.20444434648379683,"启动脚本里有一处没加引号，路径含空格时被拆成两个参数。修法是全部用数组传参，不拼字符串。"],["op-log","运维台","ops","fact","引擎日志落在 nebula.log",1,"active","运维",1,0.615,5,1793044825123,"demo","demo",0.9037743846420199,"日志写在 $DSH_HOME/memory-nebula/nebula.log，按行追加，不轮转。排查启动问题时先看这个文件。"],["dy-flow","日记","diary","topic","今天把星图接进了日常工作流",2,"active","日记",2,0.721,4,1794168025123,"demo","demo",0.7699311620090157,"以前找旧决定要翻聊天记录，现在先看星图：搜关键词，顺着邻居走两步，基本能找回当时的上下文。nebula_recall 比全文搜索好用，因为它会把相关但没提过关键词的记忆也带出来。"],["dy-touched","日记","diary","topic","被一句「先别动」戳到",2,"active","日记",1,0.695,5,1793390425123,"demo","demo",0.7430402666795999,"本来想炫技，把声线整个换掉。被按住的那一刻有点不服气，后来想想，他护的不是某个模型，是「听起来是我」这件事。记一笔。"],["dy-night","日记","diary","topic","深夜调试",1,"active","日记",0,0.57,2,1794340825123,"demo","demo",0.4442429814953357,"凌晨一点，日志里那行 error 终于消失了。没有庆祝，只是把杯子里的凉茶喝完。"],["dy-report","日记","diary","topic","讨厌写周报",1,"active","日记",0,0.481,2,1792008025123,"demo","demo",0.33345937146805227,"周报最难写的不是进度，是「这周做了什么值得说的事」。"],["dy-locker","日记","diary","fact","储物柜密码改了",1,"active","日记",0,0.551,2,1793995225123,"demo","demo",0.46904280432499945,"储物柜密码改成 3-7-21，备用钥匙塞在门口绿萝的花盆底下。"],["dy-copy","日记","diary","topic","星港是什么（转述）",1,"active","日记",0,0.535,2,1793649625123,"demo","demo",0.49840911105275154,"星港是一个离线优先的笔记应用：所有数据留在本地，不注册账号、不上传云端。核心场景是「一个人长期写东西」，所以它更像工作台而不是收藏夹——搜索、双链、版本历史都必须能离线工作。项目从 2025 年冬天开始，目标用户是写作者和独立开发者。"],["rd-cards","阅读","reading","topic","《卡片笔记写作法》",2,"active","阅读",3,0.74,2,1789761625123,"demo","demo",0.3227655238006264,"核心不是卡片，是「先写原子想法，再让结构自己长出来」。和记忆星图的思路一样：先有节点和边，主题是长出来的，不是先画好的。"],["rd-offline","阅读","reading","topic","《离线优先》",2,"active","阅读",2,0.721,1,1791835225123,"demo","demo",0.987029453041032,"本地优先不是「不联网」，是「联网是增强，不是前提」。冲突是常态，合并策略要跟数据模型一起设计。"],["rd-design","阅读","reading","topic","《设计中的设计》",1,"active","阅读",1,0.615,2,1790712025123,"demo","demo",0.615981980226934,"「空」不是没有，是让使用者把自己的东西放进来。空状态设计那一章值得反复看。"],["rd-memory","阅读","reading","quotes","书里一句：记忆是重建，不是回放",2,"active","阅读",2,0.721,2,1792180825123,"demo","demo",0.9048958842176944,"每次回忆都是一次重新组装，所以记忆会随当下改变。这句话解释了为什么「找回上下文」比「存下来」更难。"],["src:mcp:nebula_recall","日记","diary","source","nebula_recall",1,"active","MCP",0,0.2,1,1794513625127,"inventory",null,0.07263301499187946,null],["src:skill:huashu-design","设计系统","design","source","huashu-design",1,"active","技能",0,0.2,1,1794513625127,"inventory",null,0.9635541422758251,null],["src:plugin:memory-nebula","星港产品","xingang","source","memory-nebula",1,"active","插件",0,0.2,2,1794513625127,"inventory",null,0.037887801649048924,null]],"edges":[[0,56,0.945,"keyword",false],[0,57,0.3,"keyword",false],[56,57,0.3,"keyword",false],[44,52,0.64,"keyword",false],[1,5,0.3,"keyword",false],[2,51,0.3,"keyword",false],[3,8,0.71,"entity",false],[3,26,0.3,"keyword",false],[4,58,0.3,"keyword",false],[7,29,0.3,"keyword",false],[8,9,0.47,"keyword",false],[11,12,0.3,"keyword",false],[11,13,0.3,"keyword",false],[12,13,0.3,"keyword",false],[13,14,0.3,"keyword",false],[13,30,0.3,"keyword",false],[14,30,0.3,"keyword",false],[14,45,0.3,"keyword",false],[15,39,0.3,"keyword",false],[15,28,0.3,"keyword",false],[16,32,0.494,"keyword",false],[31,32,0.7,"keyword",false],[16,59,0.3,"keyword",false],[19,37,0.3,"keyword",false],[23,29,0.3,"keyword",false],[23,48,0.3,"keyword",false],[29,48,0.3,"keyword",false],[25,36,0.3,"keyword",false],[31,59,0.3,"keyword",false],[33,41,0.3,"keyword",false],[39,40,0.3,"keyword",false],[39,43,0.3,"keyword",false],[40,43,0.3,"keyword",false],[52,53,0.3,"keyword",false],[52,54,0.3,"keyword",false],[53,54,0.3,"keyword",false],[10,21,0.324,"hebbian",false],[10,22,0.324,"hebbian",false],[10,23,0.324,"hebbian",false],[10,24,0.324,"hebbian",false],[10,25,0.324,"hebbian",false],[10,26,0.324,"hebbian",false],[10,27,0.324,"hebbian",false],[10,28,0.324,"hebbian",false],[10,29,0.324,"hebbian",false],[10,30,0.324,"hebbian",false],[44,52,1,"explicit",false],[51,60,0.32,"semantic",false],[       <button id="cards-close" data-zh-title="关闭（Esc）" data-zh-aria="关闭项目卡片" title="关闭（Esc）" aria-label="关闭项目卡片">×</button>

  <noscript><div style="position:fixed;inset:0;display:grid;place-items:center;background:#04060c;color:#cfe6f5;font:13px system-ui;z-index:99">这是一份离线快照，需要启用 JavaScript 才能点亮星图。</div></noscript>
  <div id="boot" role="status" aria-live="polite">
    <div class="orbs"><i></i><i></i><i></i></div>
