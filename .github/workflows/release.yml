name: Release

# 打一个 v* 标签就自动建 Release，并把打好的 tgz 与校验和挂上去。
# 这样「从 GitHub 装」永远有可下的包，不必等人手动上传。
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Pack
        run: |
          npm pack --ignore-scripts
          sha256sum ./*.tgz > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" ./*.tgz SHA256SUMS.txt \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            --verify-tag
