name: Release

# 打一个 v* 标签就自动建 Release，并把打好的 tgz 与校验和挂上去。
# 这样「从 GitHub 装」永远有可下的包，不必等人手动上传。
# 正文不交给 GitHub 的自动生成：它只会写一行 compare 链接，而这一版改了什么、
# 为什么改，本来就写在 CHANGELOG.md 里。用 scripts/release-notes.mjs 取那一段。
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Pack
        run: |
          npm pack --ignore-scripts
          sha256sum ./*.tgz > SHA256SUMS.txt
          cat SHA256SUMS.txt

      # 正文来自 CHANGELOG 的对应段落；取不到就红在这里，不要发一个只有链接的 Release。
      - name: Release notes
        run: node scripts/release-notes.mjs --version "${GITHUB_REF_NAME#v}" --out notes.md

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" ./*.tgz SHA256SUMS.txt \
            --title "${GITHUB_REF_NAME}" \
            --notes-file notes.md \
            --verify-tag
