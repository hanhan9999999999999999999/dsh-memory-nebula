name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Node ${{ matrix.node }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ['24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Environment
        run: |
          node -v
          node -e "console.log('zstd:', typeof require('node:zlib').zstdCompressSync, 'sqlite:', (() => { try { require('node:sqlite'); return 'ok' } catch (e) { return e.code || e.message } })())"
      - name: Unit tests
        run: |
          set -o pipefail
          npm test 2>&1 | tee unit-tests.log
      - name: Report failing tests
        if: failure()
        run: |
          if [ ! -f unit-tests.log ]; then
            echo "::error::unit-tests.log 没生成（上一步没跑到被测代码就挂了）"
            exit 0
          fi
          {
            echo "### 失败的用例"
            echo "```"
            grep -nE '^not ok |^    not ok |not ok [0-9]+ - ' unit-tests.log | head -n 40 || true
            echo "```"
          } >> "$GITHUB_STEP_SUMMARY"
          grep -E '^not ok |^    not ok ' unit-tests.log | head -n 10 | while IFS= read -r line; do
            echo "::error::${line}"
          done
          exit 0
      - name: Release checks
        run: npm run check

  package:
    name: Package install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Pack
        run: npm pack
      - name: Verify tarball contents
        run: |
          tar -tzf dsh-memory-nebula-*.tgz | grep -q 'package/SECURITY.md'
          tar -tzf dsh-memory-nebula-*.tgz | grep -q 'package/CONTRIBUTING.md'
          if tar -tzf dsh-memory-nebula-*.tgz | grep -q 'package/dev/'; then exit 1; fi
      - name: Install from tarball
        run: |
          mkdir -p /tmp/pkg-check && cd /tmp/pkg-check
          npm init -y
          npm install "$GITHUB_WORKSPACE"/dsh-memory-nebula-*.tgz
          test "$(node node_modules/dsh-memory-nebula/lib/standalone.mjs --version)" = "$(node -p "require('$GITHUB_WORKSPACE/package.json').version")"
          node node_modules/dsh-memory-nebula/scripts/doctor.mjs --help > /dev/null
